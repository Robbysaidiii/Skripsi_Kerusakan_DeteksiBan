{% extends "deteksi/auth/auth_base.html" %}
{% block title %}Password Berhasil Diubah — Deteksi Ban{% endblock %}

{% block auth_content %}
<div class="w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-5">
  <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
  </svg>
</div>
<h1 class="text-2xl font-bold text-slate-900 mb-1.5">Password Berhasil Diubah</h1>
<p class="text-slate-500 text-sm leading-relaxed mb-7">
  Password baru kamu sudah aktif. Silakan masuk kembali menggunakan password baru tersebut.
</p>

<a href="{% url 'deteksi:login' %}"
  class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition">
  Masuk Sekarang
</a>
{% endblock %}
