{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — TireScan</title>
<link rel="stylesheet" href="{% static 'deteksi/css/tailwind.css' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'deteksi/css/style.css' %}">
</head>
<body class="bg-[#f5f6fa] text-slate-800 min-h-screen" style="font-family:'Inter',sans-serif;">

{% if messages %}
<div class="settings-toast space-y-2">
  {% for message in messages %}
  <div class="flex items-center gap-2 {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-emerald-50 border border-emerald-200 text-emerald-700{% endif %} text-sm font-medium px-4 py-3 rounded-xl shadow-md max-w-sm">
    <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      {% if message.tags == 'error' %}
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>
      {% else %}
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      {% endif %}
    </svg>
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}

<div class="min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

    <div class="mb-6">
      <span class="text-xl font-extrabold tracking-tight text-slate-900">Tire<span class="text-blue-500">Scan</span></span>
    </div>

    <h1 class="text-xl font-bold text-slate-900 mb-1">Masuk ke akun</h1>
    <p class="text-slate-500 text-sm mb-6">
      Belum punya akun?
      <a href="{% url 'deteksi:register' %}{% if next %}?next={{ next }}{% endif %}" class="font-semibold text-blue-600 hover:underline">Daftar sekarang</a>
    </p>

    <form method="post" action="{% url 'deteksi:login' %}{% if next %}?next={{ next }}{% endif %}" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Username atau Email</label>
        <input type="text" name="username" required autofocus placeholder="Masukkan username atau email"
          class="w-full border border-blue-300 rounded-lg px-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-sm font-semibold text-slate-700">Password</label>
          <a href="{% url 'deteksi:password_reset' %}" class="text-xs font-medium text-blue-600 hover:underline">Lupa password?</a>
        </div>
        <input type="password" name="password" required placeholder="Masukkan password"
          class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400">
      </div>

      <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer select-none">
        <input type="checkbox" name="ingat_saya" value="1" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-100">
        Ingat saya
      </label>

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition mt-2">
        Masuk
      </button>
    </form>

  </div>
</div>

</body>
</html>
